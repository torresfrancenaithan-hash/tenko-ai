<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenko.ai</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#121212;color:#fff;display:flex;flex-direction:column;height:100vh}
header{background:#1f242d;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d}
header h1{font-size:17px;margin:0;color:#58a6ff}
.btn{background:#238636;border:none;color:#fff;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:bold}
.btn-s{background:#30363d}.btn-d{background:#da3633;margin-left:6px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;padding:20px;align-items:center;justify-content:center}
.mbox{background:#161b22;padding:20px;border-radius:12px;width:100%;max-width:350px;border:1px solid #30363d}
.mbox input{width:100%;padding:10px;margin:8px 0 14px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#fff}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.user{background:#1f6feb;align-self:flex-end;border-bottom-right-radius:2px}
.bot{background:#21262d;align-self:flex-start;border-bottom-left-radius:2px;border:1px solid #30363d}
.tag{font-size:10px;color:#8b949e;display:block;margin-bottom:4px;font-weight:bold}
.msg img{width:100%;border-radius:8px;display:block}
.lwrap{display:flex;align-items:center;gap:10px;padding:4px 2px}
.dots{display:flex;gap:4px}
.dots span{width:7px;height:7px;background:#58a6ff;border-radius:50%;animation:b 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.pct{font-size:13px;font-weight:bold;color:#58a6ff;min-width:38px}
@keyframes b{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
.ibar{display:flex;gap:8px;padding:10px;background:#1f242d;border-top:1px solid #30363d}
.ibar input{flex:1;padding:12px;border-radius:20px;border:1px solid #30363d;background:#0d1117;color:#fff;outline:none}
.ibar button{background:#1f6feb;border:none;color:#fff;padding:0 18px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<div id="modal"><div class="mbox">
<h3 style="margin-top:0">[Security] Tenko.ai Setup</h3>
<label style="font-size:12px">OpenRouter API Key:</label>
<input type="password" id="keyIn" placeholder="sk-or-v1-...">
<button class="btn" id="saveB">Save Key</button>
<button class="btn btn-s" id="closeB">Close</button>
<button class="btn btn-d" id="wipeB">Wipe Data</button>
<p style="font-size:11px;color:#8b949e;margin-top:12px">Learned Memories: <span id="memC">0</span> responses saved</p>
</div></div>
<header><h1>Tenko.ai</h1><button class="btn btn-s" id="setupB">Setup</button></header>
<div id="chat"><div class="msg bot"><span class="tag">[Secured System Ready]</span>Hello! I am Tenko.ai. Ask me anything in any language, paste a suspicious link to scan for scams, or type <b>/imagine [description]</b> to generate an image.</div></div>
<div class="ibar"><input type="text" id="uIn" placeholder="Ask Tenko.ai or /imagine..."><button id="sendB">Send</button></div>
<script>
function gs(k,f){try{return localStorage.getItem(k)||f}catch(e){return f}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function enc(s){try{return btoa(s.split('').reverse().join(''))}catch(e){return s}}
function dec(s){try{return atob(s).split('').reverse().join('')}catch(e){return s}}
let mem={};try{mem=JSON.parse(gs('tkMem','{}'))}catch(e){}
let key=dec(gs('tkKey',''));
document.getElementById('setupB').onclick=function(){document.getElementById('keyIn').value=key;document.getElementById('memC').textContent=Object.keys(mem).length;document.getElementById('modal').style.display='flex'};
document.getElementById('closeB').onclick=function(){document.getElementById('modal').style.display='none'};
document.getElementById('saveB').onclick=function(){const k=document.getElementById('keyIn').value.trim();if(k){key=k;ss('tkKey',enc(key));alert('API Key encrypted and saved!')}document.getElementById('modal').style.display='none'};
document.getElementById('wipeB').onclick=function(){if(confirm('Erase all data?')){mem={};key='';try{localStorage.clear()}catch(e){}alert('Wiped!');document.getElementById('modal').style.display='none'}};
function addM(t,s,tag,h){const c=document.getElementById('chat'),d=document.createElement('div');d.className='msg '+s;if(tag){const sp=document.createElement('span');sp.className='tag';sp.textContent=tag;d.appendChild(sp)}if(h){const w=document.createElement('div');w.innerHTML=t;d.appendChild(w)}else{d.appendChild(document.createTextNode(t))}c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
function genImg(p){const c=document.getElementById('chat'),b=document.createElement('div');b.className='msg bot';b.innerHTML='<div class="lwrap"><div class="dots"><span></span><span></span><span></span></div><span class="pct">0%</span></div>';c.appendChild(b);c.scrollTop=c.scrollHeight;const ps=b.querySelector('.pct');let pct=0,rdy=false;const u='https://picsum.photos(p+Math.random())+'/512/512';const im=document.createElement('img');im.style.display='none';im.src=u;b.appendChild(im);im.onload=function(){rdy=true};im.onerror=function(){clearInterval(t);b.innerHTML='<span class="tag">[Error]</span>Unavailable'};const t=setInterval(function(){if(!rdy&&pct<95){pct=Math.min(95,pct+10);ps.textContent=pct+'%'}else if(rdy&&pct<100){pct=Math.min(100,pct+15);ps.textContent=pct+'%'}if(pct===100&&rdy){clearInterval(t);const w=b.querySelector('.lwrap');if(w)w.remove();im.style.display='block';c.scrollTop=c.scrollHeight}},200)}
async function send(){const i=document.getElementById('uIn'),raw=i.value.trim();if(!raw)return;addM(raw,'user','',false);i.value='';const k=raw.toLowerCase();if(k.startsWith('/imagine ')){const p=raw.substring(9).trim();if(p)genImg(p);return}if(mem[k]){addM(mem[k],'bot','[Tenko Memory - Offline Ready]',false);return}if(!key){addM('API Key missing. Tap Setup at top right and paste sk-or-v1-...','bot','[Setup Required]',false);return}const ld=addM('<div class="lwrap"><div class="dots"><span></span><span></span><span></span></div></div>','bot','',true);try{const res=await fetch('https://openrouter.ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'HTTP-Referer':location.href,'X-Title':'Tenko.ai'},body:JSON.stringify({model:'openrouter/free',messages:[{role:'system',content:'You are Tenko.ai, a helpful multilingual personal AI assistant with cybersecurity awareness. Automatically detect the exact language used by the user and answer in that exact same language. Warn clearly if any pasted link or text looks like a scam.'},{role:'user',content:raw}]})});const data=await res.json();document.getElementById('chat').removeChild(ld);const rep=data&&data.choices&&data.choices.at(0)&&data.choices.at(0).message?data.choices.at(0).message.content:null;if(rep){mem[k]=rep.trim();ss('tkMem',JSON.stringify(mem));addM(rep.trim(),'bot','[Learned via Cloud AI - Saved]',false)}else{addM(data&&data.error?data.error.message:'Check API Key in Setup','bot','[API Error]',false)}}catch(e){document.getElementById('chat').removeChild(ld);addM('Error: '+e.message,'bot','[Network Error]',false)}}
document.getElementById('sendB').onclick=send;
</script>
</body>
</html>
